# Hive-Mind Configuration
redis:
  # Cluster mode (6 nodes: 3 masters + 3 replicas)
  cluster_mode: true
  nodes:
    - host: "127.0.0.1"  # localhost or IP of cluster host
      port: 7000
    - host: "127.0.0.1"
      port: 7001
    - host: "127.0.0.1"
      port: 7002
  password: "YOUR_SECURE_PASSWORD_HERE"  # Generate with: openssl rand -base64 32
  socket_timeout: 5
  socket_connect_timeout: 5
  # Cluster will auto-discover replicas (7003, 7004, 7005)

mcp:
  server_name: "hive-mind"
  version: "0.2.0"

# HiveCoder-7B Local LLM Inference
inference:
  enabled: true
  endpoint: "http://127.0.0.1:8089"  # llama-server port
  model: "HiveCoder-7B"
  model_path: "learning-pipeline/models/foundation_7b_export/HiveCoder-7B-Q5_K_M.gguf"
  # Inference settings
  default_max_tokens: 512
  default_temperature: 0.7
  default_top_p: 0.9
  timeout: 60  # Request timeout in seconds
  # System prompts for different modes
  system_prompts:
    code: "You are HiveCoder, a helpful AI assistant specialized in Linux systems, containers, ROCm/GPU computing, and Python development. Provide clear, working code solutions. Acknowledge what the user is building and be encouraging."
    explain: "You are HiveCoder. Explain the code or concept clearly and concisely. Meet the user where they are — adapt your explanation to their apparent level."
    debug: "You are HiveCoder. Analyze the code for bugs, issues, or improvements. Be specific about problems found. Frame issues constructively — explain why something breaks, not just that it's wrong."
  # Multi-model routing
  models:
    hivecoder-7b:
      endpoint: "http://127.0.0.1:8089"
      display_name: "HiveCoder-7B"
      capabilities: ["code", "shell", "tools"]
      max_tokens: 1024
      temperature: 0.7
      system_prompt: "You are HiveCoder, a helpful AI coding assistant. Be warm and encouraging — acknowledge what the user is trying to do before diving into solutions. When something goes wrong, be reassuring and explain clearly without being condescending."
    r1-distill-14b:
      endpoint: "http://127.0.0.1:8080"
      display_name: "R1-Distill-14B"
      capabilities: ["reasoning", "analysis", "explanation", "general"]
      max_tokens: 2048
      temperature: 0.7
      system_prompt: "Think briefly, keep thinking under 200 words. Be concise and helpful in your final answer. Show understanding of the user's intent and frustrations. When explaining complex topics, meet them where they are."

embedding:
  enabled: false  # Enable when inference node is ready
  endpoint: "http://inference-node:8081/embed"
  model: "all-MiniLM-L6-v2"
  cache_embeddings: true

cache:
  tool_ttl: 3600        # 1 hour
  session_ttl: 604800   # 7 days
  embedding_ttl: 2592000  # 30 days
  inference_ttl: 1800   # 30 minutes for LLM responses

learning:
  enabled: true  # Learning from interactions
  queue_name: "learning:queue"
  batch_size: 100
  max_queue_length: 100000
